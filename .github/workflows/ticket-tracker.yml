name: US Open Ticket Tracker

on:
  workflow_dispatch:  # lets you trigger it manually from GitHub with one click

jobs:
  check-tickets:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run ticket checker
        env:
          GMAIL_ADDRESS:  ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          NOTIFY_EMAIL:   ${{ secrets.NOTIFY_EMAIL }}
        run: python checker.py

      - name: Save state between runs
        uses: actions/cache@v4
        with:
          path: last_state.json
          key: ticket-state-${{ github.run_id }}
          restore-keys: ticket-state-
